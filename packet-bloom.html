<!DOCTYPE html>
<!--
    THIS IS A TEMPLATE THAT SHOULD BE USED EVERY TIME AND MODIFIED.
    WHAT TO KEEP:
    ✓ Overall structure (header, sidebar, main content)
    ✓ Anthropic branding (colors, fonts, layout)
    ✓ Seed navigation section (always include this)
    ✓ Self-contained artifact (everything inline)

    WHAT TO CREATIVELY EDIT:
    ✗ The p5.js algorithm (implement YOUR vision)
    ✗ The parameters (define what YOUR art needs)

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packet Bloom</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers (CUSTOMIZE THIS FOR YOUR ART) -->
            <h1>Packet Bloom</h1>
            <div class="subtitle">Paket data berjalan di topologi jaringan. Port terbuka berdenyut saat disentuh.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section -->
<div class="control-section"><h3>Parameters</h3><div class="control-group"><label>Jumlah node</label><div class="slider-container"><input type="range" id="n" min="6" max="60" step="1" value="28" oninput="updateParam('n', this.value)"><span class="value-display" id="n-value">28</span></div></div><div class="control-group"><label>Jumlah paket</label><div class="slider-container"><input type="range" id="packets" min="5" max="200" step="1" value="70" oninput="updateParam('packets', this.value)"><span class="value-display" id="packets-value">70</span></div></div><div class="control-group"><label>Kecepatan</label><div class="slider-container"><input type="range" id="speed" min="0.2" max="3" step="0.1" value="1" oninput="updateParam('speed', this.value)"><span class="value-display" id="speed-value">1</span></div></div><div class="control-group"><label>Lengkung jalur</label><div class="slider-container"><input type="range" id="curve" min="0" max="1.2" step="0.05" value="0.5" oninput="updateParam('curve', this.value)"><span class="value-display" id="curve-value">0.5</span></div></div><div class="control-group"><label>Panjang jejak</label><div class="slider-container"><input type="range" id="trail" min="4" max="40" step="1" value="18" oninput="updateParam('trail', this.value)"><span class="value-display" id="trail-value">18</span></div></div><div class="control-group"><label>Port terbuka</label><div class="slider-container"><input type="range" id="open" min="0" max="0.8" step="0.05" value="0.3" oninput="updateParam('open', this.value)"><span class="value-display" id="open-value">0.3</span></div></div></div>
<!-- Colors Section -->
<div class="control-section"><h3>Colors</h3><div class="color-group"><label>Node & jalur</label><div class="color-picker-container"><input type="color" id="color1" value="#d97757" onchange="updateColor('color1', this.value)"><span class="color-value" id="color1-value">#d97757</span></div></div><div class="color-group"><label>Port terbuka</label><div class="color-picker-container"><input type="color" id="color2" value="#6a9bcc" onchange="updateColor('color2', this.value)"><span class="color-value" id="color2-value">#6a9bcc</span></div></div><div class="color-group"><label>Paket</label><div class="color-picker-container"><input type="color" id="color3" value="#788c5d" onchange="updateColor('color3', this.value)"><span class="color-value" id="color3-value">#788c5d</span></div></div></div>
<!-- Actions Section (ALWAYS KEEP THIS) -->
<div class="control-section"><h3>Actions</h3><div class="button-row"><button class="button" onclick="initializeSystem()">Regenerate</button><button class="button secondary" onclick="resetParameters()">Reset</button></div><div class="button-row" style="margin-top:8px"><button class="button tertiary" onclick="saveCanvas('packet-bloom-'+params.seed,'png')">Download PNG</button></div></div>
</div>
<!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>

let params = {seed: 12345, n: 28, packets: 70, speed: 1, curve: 0.5, trail: 18, open: 0.3, sc: 2, colorPalette: ['#d97757', '#6a9bcc', '#788c5d']};
let defaultParams = {...params, colorPalette: [...params.colorPalette]};
let sim;
function PB(W,H,seed,o){
let s=seed|0;const R=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const P0=[];
for(let i=0;i<o.n;i++){let b,bd=-1;for(let k=0;k<10;k++){const p=[W*.07+R()*W*.86,H*.07+R()*H*.86];let d=1e9;for(const q of P0)d=Math.min(d,(p[0]-q[0])**2+(p[1]-q[1])**2);if(d>bd){bd=d;b=p}}P0.push(b)}
const E=[],seen={},adj=P0.map(()=>[]);
P0.forEach((p,i)=>{P0.map((q,j)=>[j,(p[0]-q[0])**2+(p[1]-q[1])**2]).filter(x=>x[0]!=i).sort((a,b)=>a[1]-b[1]).slice(0,2).forEach(([j,d])=>{const k=Math.min(i,j)+"-"+Math.max(i,j);if(seen[k])return;seen[k]=1;const q=P0[j],a=Math.atan2(q[1]-p[1],q[0]-p[0])+Math.PI/2,c=(R()-.5)*o.curve*Math.sqrt(d),e={a:i,b:j,x:(p[0]+q[0])/2+Math.cos(a)*c,y:(p[1]+q[1])/2+Math.sin(a)*c};E.push(e);adj[i].push(e);adj[j].push(e)})});
const open=P0.map(()=>R()<o.open),pulse=P0.map(()=>0);
const pos=p=>{const A=P0[p.e.a],B=P0[p.e.b],u=p.f?1-p.t:p.t,v=1-u;return[v*v*A[0]+2*v*u*p.e.x+u*u*B[0],v*v*A[1]+2*v*u*p.e.y+u*u*B[1]]};
const K=[];for(let i=0;i<o.packets;i++)K.push({e:E[R()*E.length|0],f:R()<.5,t:R(),v:.004+R()*.009,h:[],c:R()*3|0});
return{
step(dt){for(const p of K){p.t+=p.v*o.speed*dt;if(p.t>=1){const n=p.f?p.e.a:p.e.b,l=adj[n],e=l[R()*l.length|0];p.f=e.a!==n;p.e=e;p.t=0;pulse[n]=1}p.h.push(pos(p));while(p.h.length>o.trail)p.h.shift()}for(let i=0;i<pulse.length;i++)pulse[i]*=.96},
draw(g,C){const sc=o.sc;g.lineCap="round";g.lineJoin="round";
g.globalAlpha=.2;g.strokeStyle=C[0];g.lineWidth=Math.max(.6,sc);
for(const e of E){const A=P0[e.a],B=P0[e.b];g.beginPath();g.moveTo(A[0],A[1]);g.quadraticCurveTo(e.x,e.y,B[0],B[1]);g.stroke()}
for(const p of K){const h=p.h,n=h.length;g.strokeStyle=C[p.c];g.lineWidth=Math.max(.8,1.7*sc);for(let i=1;i<n;i++){g.globalAlpha=i/n*.9;g.beginPath();g.moveTo(h[i-1][0],h[i-1][1]);g.lineTo(h[i][0],h[i][1]);g.stroke()}}
P0.forEach((p,i)=>{const r=Math.max(1.5,3*sc);g.globalAlpha=.85;g.fillStyle=C[0];g.beginPath();g.arc(p[0],p[1],r,0,7);g.fill();if(open[i]){g.globalAlpha=.25+pulse[i]*.6;g.strokeStyle=C[1];g.lineWidth=Math.max(.8,1.4*sc);g.beginPath();g.arc(p[0],p[1],r*2+pulse[i]*r*3,0,7);g.stroke()}});
g.globalAlpha=1}}}

function setup() {
    pixelDensity(1);
    let canvas = createCanvas(1200, 1200);
    canvas.parent('canvas-container');
    initializeSystem();
    document.querySelector('.loading').style.display = 'none';
}
function initializeSystem() {
    randomSeed(params.seed);
    noiseSeed(params.seed);
    sim = PB(1200, 1200, params.seed, params);
    for (let i = 0; i < 30; i++) sim.step(1);
}
function draw() {
    background(250, 249, 245);
    sim.step(1);
    sim.draw(drawingContext, params.colorPalette);
}
function updateParam(paramName, value) {
    params[paramName] = parseFloat(value);
    document.getElementById(paramName + '-value').textContent = value;
    if (['n', 'packets', 'curve', 'open'].includes(paramName)) initializeSystem();
}
function updateColor(colorId, value) {
    params.colorPalette[parseInt(colorId.slice(-1)) - 1] = value;
    document.getElementById(colorId + '-value').textContent = value;
}
        // SEED CONTROL FUNCTIONS - ALWAYS KEEP THESE
        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                // Reset to current seed if invalid
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams, colorPalette: [...defaultParams.colorPalette]};
            ['n', 'packets', 'speed', 'curve', 'trail', 'open'].forEach(k => {
                document.getElementById(k).value = params[k];
                document.getElementById(k + '-value').textContent = params[k];
            });
            params.colorPalette.forEach((c, x) => {
                document.getElementById('color' + (x + 1)).value = c;
                document.getElementById('color' + (x + 1) + '-value').textContent = c;
            });
            updateSeedDisplay();
            initializeSystem();
        }
        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
